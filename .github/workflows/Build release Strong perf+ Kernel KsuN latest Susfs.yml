name: Build release Strong perf+ Kernel - Ignis-Rei (munch) _KsuNext latest SUSFS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Nhập tên nhánh (branch) chứa patch / code sửa đổi (vd: main, perf)'
        required: true
        default: 'perf'
        type: string
      variant:
        description: 'Kernel Variant to Build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - aosp
          - stock
      build_type:
        description: 'Loại Kernel (all = build cả 3: noroot, ksun-nosusfs, ksun-susfs)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ksun-susfs
          - ksun-nosusfs
          - noroot

permissions:
  contents: write

jobs:
  build:
    name: Build Ignis-Rei for Xiaomi POCO F4 (munch)
    runs-on: ubuntu-22.04

    env:
      KBUILD_BUILD_USER: "strong"
      KBUILD_BUILD_HOST: "GitHub-Actions"

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'perf' }}
          fetch-depth: 1

      - name: Prepare Build Metadata
        id: meta
        run: |
          RAW_BRANCH="${{ github.event.inputs.branch || 'perf' }}"
          SAFE_BRANCH=$(echo "$RAW_BRANCH" | tr '/:@' '-')
          BUILD_DATE=$(TZ='Asia/Ho_Chi_Minh' date +'%Y%m%d-%H%M')
          DISPLAY_DATE=$(TZ='Asia/Ho_Chi_Minh' date +'%d/%m/%Y %H:%M ICT')
          echo "raw_branch=${RAW_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "safe_branch=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "tag=Strong-perf-Ignis-Rei-munch-${SAFE_BRANCH}-${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "date=${DISPLAY_DATE}" >> "$GITHUB_OUTPUT"

      - name: Create SuSFS Auto-Patch Helper Script
        run: |
          cat << 'PYEOF' > /tmp/apply_susfs.py
          import os, re, shutil, subprocess, sys

          root = sys.argv[1]
          susfs_419_repo = sys.argv[2]
          wild_repo = sys.argv[3]
          mode = sys.argv[4]  # "preflight" hoặc "apply"
          extra_repos = sys.argv[5:]
          report_path = "/tmp/susfs_preflight_report.txt"

          def dump_rejects(title, base_dir, rej_list, extra_info=""):
              lines = [f"=== {title} ({len(rej_list)} file .rej) ==="]
              if extra_info:
                  lines.append(extra_info)
              for rf in sorted(rej_list):
                  rel = os.path.relpath(rf, base_dir)
                  with open(rf, "r") as f:
                      cnt = len(re.findall(r'^@@ ', f.read(), flags=re.M))
                  lines.append(f"  - {rel} ({cnt} hunk)")
              lines.append("")
              for rf in sorted(rej_list):
                  rel = os.path.relpath(rf, base_dir)
                  lines.append(f"================ {rel} ================")
                  with open(rf, "r") as f:
                      lines.append(f.read())
              output = "\n".join(lines)
              with open(report_path, "w") as out:
                  out.write(output)
              print(f"::error::{title}", flush=True)
              print(output, flush=True)
              sys.exit(1)

          # 1. Tìm file patch SuSFS mới nhất cho kernel 4.19 và thư mục source susfs (nếu có)
          kernel_patch = None
          susfs_c_file = None
          susfs_inc_dir = None

          for dp, _, fns in os.walk(susfs_419_repo):
              for fn in fns:
                  low = fn.lower()
                  full = os.path.join(dp, fn)
                  if low.endswith(".patch") and "susfs" in low and "4.19" in low:
                      kernel_patch = full
                  elif fn == "susfs.c":
                      susfs_c_file = full
                  elif fn == "susfs.h":
                      susfs_inc_dir = dp

          if not kernel_patch:
              print("::error::Không tìm thấy file patch SuSFS cho kernel 4.19 trong repo backport!", flush=True)
              sys.exit(1)

          print(f">>> Kernel 4.19 SuSFS patch: {kernel_patch}", flush=True)
          if susfs_c_file:
              print(f">>> SuSFS core source: {susfs_c_file}", flush=True)

          def extract_added_block(hunk_text):
              added = []
              for line in hunk_text.splitlines():
                  if line.startswith("+++") or line.startswith("---"):
                      continue
                  if line.startswith("+"):
                      added.append(line[1:])
              return "\n".join(added)

          def autofix_kernel_rejects(work_dir):
              # 1) Auto-fix fs/namespace.c (backport fs_context: vfs_kern_mount -> vfs_create_mount & clone_mnt)
              ns_c = os.path.join(work_dir, "fs/namespace.c")
              ns_rej = ns_c + ".rej"
              if os.path.exists(ns_rej) and os.path.exists(ns_c):
                  with open(ns_rej, "r") as f:
                      rej = f.read()
                  with open(ns_c, "r") as f:
                      src = f.read()
                  hunks = re.split(r'(?=^@@ )', rej, flags=re.M)
                  header = hunks[0]
                  remaining = []

                  for h in hunks[1:]:
                      # 1a) vfs_kern_mount -> vfs_create_mount
                      if "vfs_kern_mount" in h and "alloc_vfsmnt(" in h:
                          patched_ns = False
                          m_fn = re.search(
                              r'struct\s+vfsmount\s*\*\s*vfs_create_mount\s*\(\s*struct\s+fs_context\s*\*\s*fc\s*\)\s*\{',
                              src
                          )
                          if m_fn:
                              start = m_fn.end()
                              sub = src[start:start + 2500]
                              m_alloc = re.search(r'^([ \t]*)mnt\s*=\s*alloc_vfsmnt\(([^,\n;]+)\);', sub, flags=re.M)
                              if m_alloc:
                                  ind, arg = m_alloc.group(1), m_alloc.group(2).strip()
                                  rebuilt = []
                                  for line in h.splitlines():
                                      if line.startswith(("@@", "---", "+++")):
                                          continue
                                      if line.startswith("+"):
                                          code_line = line[1:]
                                          code_line = re.sub(
                                              r'(\b(?:susfs_alloc_non_unshare_ksu_vfsmnt|alloc_vfsmnt)\s*\(\s*)name\b',
                                              rf'\1{arg}',
                                              code_line
                                          )
                                          if "bypass_orig_flow:" in code_line and "bypass_orig_flow:;" not in code_line:
                                              code_line = code_line.replace("bypass_orig_flow:", "bypass_orig_flow:;")
                                          rebuilt.append(code_line)
                                      elif line.startswith(" ") and "mnt = alloc_vfsmnt(" in line:
                                          rebuilt.append(f"{ind}mnt = alloc_vfsmnt({arg});")

                                  if any("susfs_is_current_ksu_domain" in l or "alloc_vfsmnt" in l for l in rebuilt):
                                      replacement = "\n".join(rebuilt)
                                      src = src[:start + m_alloc.start()] + replacement + src[start + m_alloc.end():]
                                      patched_ns = True
                                      print(f">>> Auto-fixed fs/namespace.c (vfs_create_mount, arg={arg}) thành công!", flush=True)
                          if not patched_ns:
                              remaining.append(h)

                      # 1b) clone_mnt
                      elif "clone_mnt" in h and "old->mnt_devname" in h:
                          patched_clone = False
                          m_fn = re.search(r'static\s+struct\s+mount\s*\*clone_mnt\s*\([^)]*\)\s*\{', src, flags=re.S)
                          if m_fn:
                              start = m_fn.end()
                              sub = src[start:start + 2500]
                              m_alloc = re.search(r'^([ \t]*)mnt\s*=\s*alloc_vfsmnt\(\s*old->mnt_devname\s*\);', sub, flags=re.M)
                              if m_alloc:
                                  ind = m_alloc.group(1)
                                  added_code = extract_added_block(h)
                                  if added_code and "alloc_vfsmnt(" in added_code:
                                      if "bypass_orig_flow:" in added_code and "bypass_orig_flow:;" not in added_code:
                                          added_code = added_code.replace("bypass_orig_flow:", "bypass_orig_flow:;")
                                      lines_blk = added_code.splitlines()
                                      ifdef_line = lines_blk[0] if lines_blk[0].startswith("#ifdef") else "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT"
                                      body_lines = lines_blk[1:] if lines_blk[0].startswith("#ifdef") else lines_blk
                                      indented_body = "\n".join("\t" + l if l.strip() else l for l in body_lines)
                                      replacement = (
                                          f"{ifdef_line}\n{ind}{{\n{indented_body}\n{ind}}}\n"
                                          f"#else\n{ind}mnt = alloc_vfsmnt(old->mnt_devname);\n#endif"
                                      )
                                      src = src[:start + m_alloc.start()] + replacement + src[start + m_alloc.end():]
                                      patched_clone = True
                                      print(">>> Auto-fixed fs/namespace.c (clone_mnt) thành công!", flush=True)
                          if not patched_clone:
                              remaining.append(h)
                      else:
                          remaining.append(h)

                  with open(ns_c, "w") as f:
                      f.write(src)
                  if not remaining:
                      os.remove(ns_rej)
                  else:
                      with open(ns_rej, "w") as f:
                          f.write(header + "".join(remaining))

              # 2) Auto-fix kernel/sys.c
              sys_c = os.path.join(work_dir, "kernel/sys.c")
              sys_rej = sys_c + ".rej"
              if os.path.exists(sys_rej) and os.path.exists(sys_c):
                  with open(sys_c, "r") as f:
                      src = f.read()
                  changed = False
                  if "susfs_spoof_uname" not in src:
                      target_def = "SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)"
                      if target_def in src:
                          src = src.replace(
                              target_def,
                              "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\nextern void susfs_spoof_uname(struct new_utsname* tmp);\n#endif\n" + target_def,
                              1
                          )
                          pos = src.find(target_def)
                          sub = src[pos:]
                          m = re.search(r'(memcpy\(&tmp,\s*utsname\(\),\s*sizeof\(tmp\)\);)', sub)
                          if m:
                              ins = m.group(1) + "\n#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tsusfs_spoof_uname(&tmp);\n#endif"
                              src = src[:pos] + sub[:m.start()] + ins + sub[m.end():]
                              changed = True
                  if changed:
                      with open(sys_c, "w") as f:
                          f.write(src)
                      os.remove(sys_rej)
                      print(">>> Auto-fixed kernel/sys.c thành công!", flush=True)

              # 3) Auto-fix #include <linux/susfs_def.h> trong fs/proc/task_mmu.c
              mmu_c = os.path.join(work_dir, "fs/proc/task_mmu.c")
              mmu_rej = mmu_c + ".rej"
              if os.path.exists(mmu_rej) and os.path.exists(mmu_c):
                  with open(mmu_rej, "r") as f:
                      rej = f.read()
                  with open(mmu_c, "r") as f:
                      src = f.read()
                  hunks = re.split(r'(?=^@@ )', rej, flags=re.M)
                  header = hunks[0]
                  remaining = []
                  for h in hunks[1:]:
                      if "susfs_def.h" in h and "#include" in h:
                          if "susfs_def.h" not in src:
                              for anchor in ("#include <linux/mm_inline.h>", "#include <linux/uaccess.h>", "#include <linux/pkeys.h>"):
                                  if anchor in src:
                                      src = src.replace(
                                          anchor,
                                          anchor + "\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif",
                                          1
                                      )
                                      print(">>> Auto-fixed #include <linux/susfs_def.h> trong fs/proc/task_mmu.c", flush=True)
                                      break
                      else:
                          remaining.append(h)
                  with open(mmu_c, "w") as f:
                      f.write(src)
                  if not remaining:
                      os.remove(mmu_rej)
                  else:
                      with open(mmu_rej, "w") as f:
                          f.write(header + "".join(remaining))

              # 4) Auto-fix #include <linux/susfs.h> & <linux/susfs_def.h> trong fs/stat.c
              stat_c = os.path.join(work_dir, "fs/stat.c")
              stat_rej = stat_c + ".rej"
              if os.path.exists(stat_c):
                  with open(stat_c, "r") as f:
                      src = f.read()
                  if "susfs_is_current_app_uid" in src or "STATX_SUS_KSTAT" in src:
                      inc_block = ""
                      if "susfs_def.h" not in src:
                          inc_block += "\n#include <linux/susfs_def.h>"
                      if "susfs.h" not in src:
                          inc_block += "\n#include <linux/susfs.h>"
                      if inc_block:
                          for anchor in ("#include <linux/fs.h>", "#include <linux/stat.h>", "#include <linux/mm.h>"):
                              if anchor in src:
                                  src = src.replace(
                                      anchor,
                                      anchor + "\n#ifdef CONFIG_KSU_SUSFS" + inc_block + "\n#endif",
                                      1
                                  )
                                  with open(stat_c, "w") as f:
                                      f.write(src)
                                  print(">>> Auto-fixed #include susfs headers trong fs/stat.c thành công!", flush=True)
                                  break
              if os.path.exists(stat_rej):
                  with open(stat_rej, "r") as f:
                      rej = f.read()
                  hunks = re.split(r'(?=^@@ )', rej, flags=re.M)
                  header = hunks[0]
                  remaining = [h for h in hunks[1:] if not ("#include" in h and "susfs" in h)]
                  if not remaining:
                      os.remove(stat_rej)
                  else:
                      with open(stat_rej, "w") as f:
                          f.write(header + "".join(remaining))

          if mode == "preflight":
              work_dir = "/tmp/susfs_preflight"
              shutil.rmtree(work_dir, ignore_errors=True)
              os.makedirs(work_dir, exist_ok=True)
              with open(kernel_patch, "r") as f:
                  patch_txt = f.read()
              touched = set(re.findall(r'^(?:--- a/|\+\+\+ b/)([^\s\t]+)', patch_txt, flags=re.M))
              for rel in touched:
                  src_file = os.path.join(root, rel)
                  if os.path.isfile(src_file):
                      dst_file = os.path.join(work_dir, rel)
                      os.makedirs(os.path.dirname(dst_file), exist_ok=True)
                      shutil.copy2(src_file, dst_file)
          else:
              work_dir = root

          if susfs_c_file:
              os.makedirs(os.path.join(work_dir, "fs"), exist_ok=True)
              shutil.copy2(susfs_c_file, os.path.join(work_dir, "fs", "susfs.c"))
          if susfs_inc_dir:
              os.makedirs(os.path.join(work_dir, "include", "linux"), exist_ok=True)
              for fn in os.listdir(susfs_inc_dir):
                  if fn.startswith("susfs") and fn.endswith(".h"):
                      shutil.copy2(os.path.join(susfs_inc_dir, fn), os.path.join(work_dir, "include", "linux", fn))

          # Áp patch SuSFS cho kernel 4.19
          with open(kernel_patch, "rb") as pf:
              subprocess.run(
                  ["patch", "-p1", "--forward", "--batch", "--fuzz=3"],
                  cwd=work_dir, stdin=pf, check=False
              )

          autofix_kernel_rejects(work_dir)

          rej_files = [
              os.path.join(dp, fn)
              for dp, _, fns in os.walk(work_dir)
              for fn in fns if fn.endswith(".rej")
          ]
          if rej_files:
              dump_rejects("Patch SuSFS cho kernel 4.19 vẫn còn file .rej cần xử lý", work_dir, rej_files)

          # Đọc SUSFS_VERSION sau khi patch đã tạo include/linux/susfs.h
          susfs_ver = "unknown"
          patched_susfs_h = os.path.join(work_dir, "include", "linux", "susfs.h")
          patched_susfs_def_h = os.path.join(work_dir, "include", "linux", "susfs_def.h")
          patched_susfs_c = os.path.join(work_dir, "fs", "susfs.c")
          if os.path.isfile(patched_susfs_h):
              with open(patched_susfs_h, "r", errors="replace") as hf:
                  m_ver = re.search(r'^\s*#define\s+SUSFS_VERSION\s+"([^"]+)"', hf.read(), flags=re.M)
                  if m_ver:
                      susfs_ver = m_ver.group(1).strip()

          print(f">>> Áp patch SuSFS ({susfs_ver}) cho kernel 4.19 thành công (0 .rej)!", flush=True)

          # 2. Tích hợp SuSFS cho KernelSU-Next
          ksu_kconfig = os.path.realpath(os.path.join(root, "drivers/kernelsu/Kconfig"))
          ksu_dir = os.path.dirname(ksu_kconfig)
          ksu_root = os.path.dirname(ksu_dir) if os.path.basename(ksu_dir) == "kernel" else ksu_dir

          for mf in ("Makefile", "Kbuild"):
              mp = os.path.join(ksu_dir, mf)
              if os.path.isfile(mp):
                  with open(mp, "r") as f:
                      for line in f:
                          if "KSU_VERSION" in line or "VERSION" in line:
                              print(f">>> {mf}: {line.strip()}", flush=True)

          def verify_ksu_susfs_symbols(test_dir):
              combined = []
              for dp, _, fns in os.walk(test_dir):
                  for fn in fns:
                      if fn.endswith((".c", ".h", "Kconfig", "Kbuild", "Makefile")):
                          with open(os.path.join(dp, fn), "r", errors="replace") as f:
                              combined.append(f.read())
              blob = "\n".join(combined)
              required_syms = [
                  "KSU_SUSFS",
                  "susfs_init",
                  "susfs_set_batch_sid",
                  "susfs_is_current_ksu_domain",
                  "susfs_ksu_sid",
                  "susfs_priv_app_sid",
                  "SUSFS_MAGIC",
                  "susfs_set_current_proc_umounted",
              ]
              return [s for s in required_syms if s not in blob]

          def is_ksu_susfs_patch(path):
              try:
                  with open(path, "r", errors="replace") as f:
                      txt = f.read()
                  if "fs/namespace.c" in txt or "fs/namei.c" in txt:
                      return False
                  return ("config KSU_SUSFS" in txt) or ("CONFIG_KSU_SUSFS" in txt and "susfs_set_sid" in txt)
              except Exception:
                  return False

          search_repos = [susfs_419_repo, wild_repo] + list(extra_repos)
          all_ksu_patches = []
          for repo_dir in search_repos:
              if not os.path.isdir(repo_dir):
                  continue
              for dp, _, fns in os.walk(repo_dir):
                  for fn in fns:
                      if fn.lower().endswith(".patch"):
                          full = os.path.join(dp, fn)
                          if is_ksu_susfs_patch(full):
                              all_ksu_patches.append(full)

          ver_digits = re.sub(r'^v', '', susfs_ver).lower()

          def patch_priority(p):
              low = p.lower()
              is_ksun = "ksun" in low or "next" in low
              is_cur_ver = bool(ver_digits and ver_digits != "unknown" and ver_digits in low) or ("f7ae19ef" in low)
              is_arch = "archived" in low
              return (0 if is_ksun else 1, 0 if is_cur_ver else 1, 0 if not is_arch else 1, low)

          candidates = sorted(set(all_ksu_patches), key=patch_priority)

          def try_apply_ksun_patch(src_ksu_root, patch_file):
              test_root = "/tmp/ksu_cand_test"
              shutil.rmtree(test_root, ignore_errors=True)
              shutil.copytree(src_ksu_root, test_root, symlinks=True)
              test_dir = (
                  os.path.join(test_root, "kernel")
                  if os.path.isdir(os.path.join(test_root, "kernel"))
                  else test_root
              )
              with open(patch_file, "r") as f:
                  ptxt = f.read()
              has_ksubdir = os.path.isdir(os.path.join(test_root, "kernel"))
              has_kprefix = bool(re.search(r'^\+\+\+ b/kernel/', ptxt, flags=re.M))
              if has_ksubdir and has_kprefix:
                  cwd, strip = test_root, "-p1"
              elif not has_ksubdir and has_kprefix:
                  cwd, strip = test_dir, "-p2"
              else:
                  cwd, strip = test_dir, "-p1"
              res = subprocess.run(
                  ["patch", strip, "--forward", "--batch", "--fuzz=3"],
                  cwd=cwd, input=ptxt.encode("utf-8"),
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=False
              )
              out_log = res.stdout.decode("utf-8", errors="replace")
              skipped = ("can't find file to patch" in out_log) or ("Skipping patch" in out_log)
              rejs = [
                  os.path.join(dp, fn)
                  for dp, _, fns in os.walk(test_root)
                  for fn in fns if fn.endswith(".rej")
              ]
              missing_syms = verify_ksu_susfs_symbols(test_dir)
              ok = (res.returncode == 0) and (not skipped) and (len(rejs) == 0) and (len(missing_syms) == 0)
              return test_root, rejs, ok, skipped, missing_syms

          def ensure_susfs_includes(src):
              if "linux/susfs.h" in src and "linux/susfs_def.h" in src:
                  return src
              inc = "\n#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#include <linux/susfs_def.h>\n#endif\n"
              depth = 0
              last_top_include_end = None
              first_include_start = None
              pos = 0
              for line in src.splitlines(keepends=True):
                  stripped = line.strip()
                  if re.match(r'^#\s*(?:if|ifdef|ifndef)\b', stripped):
                      depth += 1
                  elif re.match(r'^#\s*endif\b', stripped):
                      depth = max(0, depth - 1)
                  elif re.match(r'^#\s*include\s+[<"][^>"]+[>"]', stripped):
                      if first_include_start is None:
                          first_include_start = pos
                      if depth == 0:
                          last_top_include_end = pos + len(line)
                  pos += len(line)
              if last_top_include_end is not None:
                  return src[:last_top_include_end] + inc + src[last_top_include_end:]
              if first_include_start is not None:
                  return src[:first_include_start] + inc + src[first_include_start:]
              return inc + src

          def integrate_susfs_into_ksun(test_dir):
              susfs_h_txt = open(patched_susfs_h, "r", errors="replace").read() if os.path.isfile(patched_susfs_h) else ""
              susfs_def_txt = open(patched_susfs_def_h, "r", errors="replace").read() if os.path.isfile(patched_susfs_def_h) else ""
              susfs_c_txt = open(patched_susfs_c, "r", errors="replace").read() if os.path.isfile(patched_susfs_c) else ""
              kpatch_txt = open(kernel_patch, "r", errors="replace").read()

              referenced_cfgs = set(re.findall(r'\bCONFIG_(KSU_SUSFS_[A-Z0-9_]+)\b', susfs_c_txt + "\n" + kpatch_txt))

              # 1) Kconfig
              kcfg_path = os.path.join(test_dir, "Kconfig")
              with open(kcfg_path, "r") as f:
                  kcfg = f.read()
              if "config KSU_SUSFS" not in kcfg:
                  standard_opts = [
                      ("KSU_SUSFS_SUS_PATH", "Enable to hide suspicious path"),
                      ("KSU_SUSFS_SUS_MOUNT", "Enable to hide suspicious mounts"),
                      ("KSU_SUSFS_SUS_KSTAT", "Enable to spoof suspicious kstat"),
                      ("KSU_SUSFS_SPOOF_UNAME", "Enable to spoof uname"),
                      ("KSU_SUSFS_ENABLE_LOG", "Enable logging susfs log to kernel"),
                      ("KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS", "Enable to automatically hide ksu and susfs symbols"),
                      ("KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG", "Enable to spoof /proc/cmdline or /proc/bootconfig"),
                      ("KSU_SUSFS_OPEN_REDIRECT", "Enable to redirect a path to be opened with another path"),
                      ("KSU_SUSFS_SUS_MAP", "Enable to hide some mmapped real file from proc maps"),
                  ]
                  known_names = {n for n, _ in standard_opts}
                  for extra_opt in sorted(referenced_cfgs - known_names):
                      standard_opts.append((extra_opt, f"Enable {extra_opt}"))

                  block_lines = [
                      '',
                      'menu "KernelSU - SUSFS"',
                      '',
                      'config KSU_SUSFS',
                      '\tbool "KernelSU addon - SUSFS"',
                      '\tdepends on KSU',
                      '\tdepends on THREAD_INFO_IN_TASK',
                      '\tdefault y',
                      '\thelp',
                      '\t  Patch and Enable SUSFS to kernel with KernelSU.',
                      '',
                  ]
                  for opt_name, opt_desc in standard_opts:
                      block_lines.extend([
                          f'config {opt_name}',
                          f'\tbool "{opt_desc}"',
                          '\tdepends on KSU_SUSFS',
                          '\tdefault y',
                          '',
                      ])
                  block_lines.append('endmenu\n')
                  susfs_menu = "\n".join(block_lines)

                  idx = kcfg.rfind("endmenu")
                  if idx != -1:
                      kcfg = kcfg[:idx] + susfs_menu + "\n" + kcfg[idx:]
                  else:
                      kcfg += "\n" + susfs_menu
                  with open(kcfg_path, "w") as f:
                      f.write(kcfg)

              # 2) Kbuild
              kb_path = os.path.join(test_dir, "Kbuild")
              if os.path.isfile(kb_path):
                  with open(kb_path, "r") as f:
                      kb = f.read()
                  if "SUSFS_VERSION" not in kb:
                      kb += (
                          '\n## For susfs stuff ##\n'
                          'ifeq ($(shell test -e $(srctree)/fs/susfs.c; echo $$?),0)\n'
                          '$(eval SUSFS_VERSION=$(shell cat $(srctree)/include/linux/susfs.h | grep -E \'^#define SUSFS_VERSION\' | cut -d\' \' -f3 | sed \'s/"//g\'))\n'
                          '$(info )\n'
                          '$(info -- SUSFS_VERSION: $(SUSFS_VERSION))\n'
                          'else\n'
                          '$(info -- You have not integrated susfs in your kernel yet.)\n'
                          '$(info -- Read: https://gitlab.com/simonpunk/susfs4ksu)\n'
                          'endif\n'
                      )
                      with open(kb_path, "w") as f:
                          f.write(kb)

              # 3) selinux/selinux.h & selinux/selinux.c
              sel_h_path = os.path.join(test_dir, "selinux", "selinux.h")
              if os.path.isfile(sel_h_path):
                  with open(sel_h_path, "r") as f:
                      sel_h = f.read()
                  if "susfs_is_current_ksu_domain" not in sel_h:
                      decl_block = (
                          "\n#ifdef CONFIG_KSU_SUSFS\n"
                          "extern u32 susfs_ksu_sid;\n"
                          "extern u32 susfs_init_sid;\n"
                          "extern u32 susfs_zygote_sid;\n"
                          "extern u32 susfs_priv_app_sid;\n\n"
                          "bool susfs_is_sid_equal(const struct cred *cred, u32 sid2);\n"
                          "u32 susfs_get_sid_from_name(const char *secctx_name);\n"
                          "u32 susfs_get_current_sid(void);\n"
                          "bool susfs_is_current_zygote_domain(void);\n"
                          "bool susfs_is_current_ksu_domain(void);\n"
                          "bool susfs_is_current_init_domain(void);\n"
                          "void susfs_set_batch_sid(void);\n"
                          "#endif\n"
                      )
                      idx = sel_h.rfind("#endif")
                      if idx != -1:
                          sel_h = sel_h[:idx] + decl_block + "\n" + sel_h[idx:]
                      else:
                          sel_h += decl_block
                      with open(sel_h_path, "w") as f:
                          f.write(sel_h)

              sel_c_path = os.path.join(test_dir, "selinux", "selinux.c")
              if os.path.isfile(sel_c_path):
                  with open(sel_c_path, "r") as f:
                      sel_c = f.read()
                  if "susfs_is_current_ksu_domain" not in sel_c:
                      sel_c = ensure_susfs_includes(sel_c)
                      sel_c += (
                          '\n#ifdef CONFIG_KSU_SUSFS\n'
                          '#define KERNEL_INIT_DOMAIN "u:r:init:s0"\n'
                          '#define KERNEL_ZYGOTE_DOMAIN "u:r:zygote:s0"\n'
                          '#define KERNEL_PRIV_APP_DOMAIN "u:r:priv_app:s0:c512,c768"\n\n'
                          'u32 susfs_ksu_sid __read_mostly = 0;\n'
                          'u32 susfs_init_sid __read_mostly = 0;\n'
                          'u32 susfs_zygote_sid __read_mostly = 0;\n'
                          'u32 susfs_priv_app_sid __read_mostly = 0;\n\n'
                          'static inline void susfs_set_sid(const char *secctx_name, u32 *out_sid)\n'
                          '{\n'
                          '\tint err;\n'
                          '\tif (!secctx_name || !out_sid) {\n'
                          '\t\tpr_err("secctx_name || out_sid is NULL\\n");\n'
                          '\t\treturn;\n'
                          '\t}\n'
                          '\terr = security_secctx_to_secid(secctx_name, strlen(secctx_name), out_sid);\n'
                          '\tif (err) {\n'
                          '\t\tpr_err("failed setting sid for \'%s\', err: %d\\n", secctx_name, err);\n'
                          '\t\treturn;\n'
                          '\t}\n'
                          '\tpr_info("sid \'%u\' is set for secctx_name \'%s\'\\n", *out_sid, secctx_name);\n'
                          '}\n\n'
                          'bool susfs_is_sid_equal(const struct cred *cred, u32 sid2)\n'
                          '{\n'
                          '#if LINUX_VERSION_CODE < KERNEL_VERSION(6, 18, 0)\n'
                          '\tconst struct task_security_struct *tsec = selinux_cred(cred);\n'
                          '#else\n'
                          '\tconst struct cred_security_struct *tsec = selinux_cred(cred);\n'
                          '#endif\n'
                          '\tif (!tsec)\n'
                          '\t\treturn false;\n'
                          '\treturn tsec->sid == sid2;\n'
                          '}\n\n'
                          'u32 susfs_get_sid_from_name(const char *secctx_name)\n'
                          '{\n'
                          '\tu32 out_sid = 0;\n'
                          '\tint err;\n'
                          '\tif (!secctx_name)\n'
                          '\t\treturn 0;\n'
                          '\terr = security_secctx_to_secid(secctx_name, strlen(secctx_name), &out_sid);\n'
                          '\tif (err)\n'
                          '\t\treturn 0;\n'
                          '\treturn out_sid;\n'
                          '}\n\n'
                          'u32 susfs_get_current_sid(void)\n'
                          '{\n'
                          '\treturn current_sid();\n'
                          '}\n\n'
                          'bool susfs_is_current_zygote_domain(void)\n'
                          '{\n'
                          '\treturn unlikely(current_sid() == susfs_zygote_sid);\n'
                          '}\n\n'
                          'bool susfs_is_current_ksu_domain(void)\n'
                          '{\n'
                          '\treturn unlikely(current_sid() == susfs_ksu_sid);\n'
                          '}\n\n'
                          'bool susfs_is_current_init_domain(void)\n'
                          '{\n'
                          '\treturn unlikely(current_sid() == susfs_init_sid);\n'
                          '}\n\n'
                          'void susfs_set_batch_sid(void)\n'
                          '{\n'
                          '\tsusfs_set_sid(KERNEL_ZYGOTE_DOMAIN, &susfs_zygote_sid);\n'
                          '\tsusfs_set_sid(KERNEL_SU_CONTEXT, &susfs_ksu_sid);\n'
                          '\tsusfs_set_sid(KERNEL_INIT_DOMAIN, &susfs_init_sid);\n'
                          '\tsusfs_set_sid(KERNEL_PRIV_APP_DOMAIN, &susfs_priv_app_sid);\n'
                          '}\n'
                          '#endif\n'
                      )
                      with open(sel_c_path, "w") as f:
                          f.write(sel_c)

              # 4) selinux/rules.c
              rules_c_path = os.path.join(test_dir, "selinux", "rules.c")
              if os.path.isfile(rules_c_path):
                  with open(rules_c_path, "r") as f:
                      rules_c = f.read()
                  if "susfs_set_batch_sid" not in rules_c:
                      rules_c = ensure_susfs_includes(rules_c)
                      rules_c = rules_c.replace(
                          "reset_avc_cache();",
                          "reset_avc_cache();\n#ifdef CONFIG_KSU_SUSFS\n\tsusfs_set_batch_sid();\n#endif",
                          1
                      )
                      with open(rules_c_path, "w") as f:
                          f.write(rules_c)

              # 5) core/init.c
              init_c_path = os.path.join(test_dir, "core", "init.c")
              if os.path.isfile(init_c_path):
                  with open(init_c_path, "r") as f:
                      init_c = f.read()
                  if "susfs_init" not in init_c:
                      init_c = ensure_susfs_includes(init_c)
                      init_c = init_c.replace(
                          "ksu_feature_init();",
                          "#ifdef CONFIG_KSU_SUSFS\n\tsusfs_init();\n#endif\n\tksu_feature_init();",
                          1
                      )
                      with open(init_c_path, "w") as f:
                          f.write(init_c)

              # 6) Chèn handler SUSFS_MAGIC vào định nghĩa ksu_handle_sys_reboot(...) trong supercall/
              cmd_cases = [
                  ("CMD_SUSFS_ADD_SUS_PATH", "susfs_add_sus_path"),
                  ("CMD_SUSFS_ADD_SUS_PATH_LOOP", "susfs_add_sus_path_loop"),
                  ("CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS", "susfs_set_hide_sus_mnts_for_non_su_procs"),
                  ("CMD_SUSFS_ADD_SUS_KSTAT", "susfs_add_sus_kstat"),
                  ("CMD_SUSFS_UPDATE_SUS_KSTAT", "susfs_update_sus_kstat"),
                  ("CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY", "susfs_add_sus_kstat"),
                  ("CMD_SUSFS_SET_UNAME", "susfs_set_uname"),
                  ("CMD_SUSFS_ENABLE_LOG", "susfs_enable_log"),
                  ("CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG", "susfs_set_cmdline_or_bootconfig"),
                  ("CMD_SUSFS_ADD_OPEN_REDIRECT", "susfs_add_open_redirect"),
                  ("CMD_SUSFS_ADD_SUS_MAP", "susfs_add_sus_map"),
                  ("CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING", "susfs_set_avc_log_spoofing"),
                  ("CMD_SUSFS_SHOW_ENABLED_FEATURES", "susfs_get_enabled_features"),
                  ("CMD_SUSFS_SHOW_VARIANT", "susfs_show_variant"),
                  ("CMD_SUSFS_SHOW_VERSION", "susfs_show_version"),
              ]

              for dp, _, fns in os.walk(test_dir):
                  for fn in fns:
                      if not fn.endswith(".c"):
                          continue
                      fpath = os.path.join(dp, fn)
                      with open(fpath, "r") as f:
                          ftxt = f.read()
                      orig_ftxt = ftxt

                      m_rb = re.search(r'\bint\s+ksu_handle_sys_reboot\s*\(([^)]*)\)\s*\{', ftxt)
                      if m_rb and "SUSFS_MAGIC" not in ftxt:
                          raw_params = [p.strip() for p in m_rb.group(1).split(',') if p.strip()]
                          if len(raw_params) >= 4:
                              p_names = [re.sub(r'^.*[\s\*]+', '', p) for p in raw_params[:4]]
                              p_m1, p_m2, p_cmd, p_arg = p_names[0], p_names[1], p_names[2], p_names[3]
                              switch_body = []
                              for macro_name, fn_name in cmd_cases:
                                  if macro_name in susfs_def_txt and fn_name in susfs_h_txt:
                                      switch_body.append(
                                          f"\t\tcase {macro_name}:\n"
                                          f"\t\t\t{fn_name}({p_arg});\n"
                                          f"\t\t\treturn 0;"
                                      )
                              susfs_reboot_block = (
                                  "\n#ifdef CONFIG_KSU_SUSFS\n"
                                  f"\tif ({p_m1} == KSU_INSTALL_MAGIC1 && {p_m2} == SUSFS_MAGIC && current_uid().val == 0) {{\n"
                                  f"\t\tswitch ({p_cmd}) {{\n"
                                  + "\n".join(switch_body) + "\n"
                                  "\t\tdefault:\n"
                                  "\t\t\treturn -EINVAL;\n"
                                  "\t\t}\n"
                                  "\t}\n"
                                  "#endif\n"
                              )
                              ins_pos = m_rb.end()
                              ftxt = ftxt[:ins_pos] + susfs_reboot_block + ftxt[ins_pos:]
                              ftxt = ensure_susfs_includes(ftxt)
                              print(f">>> Đã chèn SUSFS_MAGIC handler vào {os.path.relpath(fpath, test_dir)}", flush=True)

                      if "on_boot_completed();" in ftxt and "susfs_start_sdcard_monitor_fn" not in ftxt and "susfs_start_sdcard_monitor_fn" in susfs_h_txt:
                          ftxt = ensure_susfs_includes(ftxt)
                          ftxt = ftxt.replace(
                              "on_boot_completed();",
                              "on_boot_completed();\n#ifdef CONFIG_KSU_SUSFS\n\t\t\tsusfs_start_sdcard_monitor_fn();\n#endif",
                              1
                          )

                      if "ksu_mark_running_process();" in ftxt and "CONFIG_KSU_SUSFS" not in ftxt:
                          ftxt = ftxt.replace(
                              "ksu_mark_running_process();",
                              "#ifndef CONFIG_KSU_SUSFS\n\t\tksu_mark_running_process();\n#endif",
                              1
                          )

                      if "ret = ksu_get_task_mark(cmd.pid);" in ftxt and "susfs_is_current_proc_umounted" not in ftxt:
                          ftxt = ensure_susfs_includes(ftxt)
                          ftxt = ftxt.replace(
                              "ret = ksu_get_task_mark(cmd.pid);",
                              "#ifdef CONFIG_KSU_SUSFS\n\t\tret = susfs_is_current_proc_umounted() ? 0 : 1;\n#else\n\t\tret = ksu_get_task_mark(cmd.pid);\n#endif",
                              1
                          )

                      if ftxt != orig_ftxt:
                          with open(fpath, "w") as f:
                              f.write(ftxt)

              # 7) feature/kernel_umount.c
              umount_c_path = os.path.join(test_dir, "feature", "kernel_umount.c")
              if os.path.isfile(umount_c_path):
                  with open(umount_c_path, "r") as f:
                      umount_c = f.read()
                  if "susfs_set_current_proc_umounted" not in umount_c:
                      umount_c = ensure_susfs_includes(umount_c)
                      umount_c = umount_c.replace(
                          "// umount the target mnt",
                          "#ifdef CONFIG_KSU_SUSFS\n\tsusfs_set_current_proc_umounted();\n#endif\n\t// umount the target mnt",
                          1
                      )
                      with open(umount_c_path, "w") as f:
                          f.write(umount_c)

              # 8) feature/sucompat.c
              sucompat_c_path = os.path.join(test_dir, "feature", "sucompat.c")
              if os.path.isfile(sucompat_c_path):
                  with open(sucompat_c_path, "r") as f:
                      sucompat_c = f.read()
                  if "susfs_is_current_proc_umounted" not in sucompat_c:
                      sucompat_c = ensure_susfs_includes(sucompat_c)
                      for fn_sig in (
                          r'(int\s+ksu_handle_faccessat\s*\([^)]*\)\s*\{)',
                          r'(int\s+ksu_handle_stat\s*\([^)]*\)\s*\{)',
                          r'(long\s+ksu_handle_execve_sucompat\s*\([^)]*\)\s*\{)',
                          r'(int\s+ksu_handle_execveat_sucompat\s*\([^)]*\)\s*\{)',
                          r'(int\s+ksu_handle_execveat\s*\([^)]*\)\s*\{)',
                      ):
                          sucompat_c = re.sub(
                              fn_sig,
                              r'\1\n#ifdef CONFIG_KSU_SUSFS\n\tif (susfs_is_current_proc_umounted())\n\t\treturn 0;\n#endif',
                              sucompat_c,
                              count=1
                          )
                      with open(sucompat_c_path, "w") as f:
                          f.write(sucompat_c)

              # 9) policy/app_profile.c
              app_prof_path = os.path.join(test_dir, "policy", "app_profile.c")
              if os.path.isfile(app_prof_path):
                  with open(app_prof_path, "r") as f:
                      app_prof = f.read()
                  if "susfs_is_current_ksu_domain" not in app_prof:
                      app_prof = ensure_susfs_includes(app_prof)
                      app_prof = app_prof.replace(
                          "if (cred->euid.val == 0) {",
                          "#ifdef CONFIG_KSU_SUSFS\n\tif (susfs_is_current_ksu_domain()) {\n#else\n\tif (cred->euid.val == 0) {\n#endif",
                          1
                      )
                      with open(app_prof_path, "w") as f:
                          f.write(app_prof)

          chosen_patch = None
          chosen_test_root = None

          for cand in candidates:
              t_root, rejs, ok, skipped, missing_syms = try_apply_ksun_patch(ksu_root, cand)
              print(
                  f"   -> Thử {os.path.basename(cand)}: {len(rejs)} .rej, skipped={skipped}, missing={missing_syms}",
                  flush=True
              )
              if ok:
                  chosen_patch = cand
                  chosen_test_root = t_root
                  break

          if chosen_patch:
              print(f">>> Đã chọn patch KSUN khớp hoàn hảo: {chosen_patch}", flush=True)
              if mode == "apply":
                  shutil.rmtree(ksu_root)
                  shutil.copytree(chosen_test_root, ksu_root, symlinks=True)
                  print(f">>> Đã ghi đè mã nguồn KernelSU-Next đã patch SuSFS ({susfs_ver})!", flush=True)
          else:
              print(">>> Không có patch ngoài khớp cấu trúc KSUN v3.4.2 -> chạy tích hợp SuSFS trực tiếp cho KSUN v3.4.2...", flush=True)
              target_ksu_root = "/tmp/ksu_integrated_test" if mode == "preflight" else ksu_root
              if mode == "preflight":
                  shutil.rmtree(target_ksu_root, ignore_errors=True)
                  shutil.copytree(ksu_root, target_ksu_root, symlinks=True)
              target_ksu_dir = (
                  os.path.join(target_ksu_root, "kernel")
                  if os.path.isdir(os.path.join(target_ksu_root, "kernel"))
                  else target_ksu_root
              )
              integrate_susfs_into_ksun(target_ksu_dir)
              missing_syms = verify_ksu_susfs_symbols(target_ksu_dir)
              if missing_syms:
                  print(f"::error::Tích hợp SuSFS cho KSUN v3.4.2 còn thiếu symbol: {missing_syms}", flush=True)
                  sys.exit(1)
              print(f">>> Tích hợp SuSFS ({susfs_ver}) vào KernelSU-Next thành công (0 .rej, đủ toàn bộ symbol)!", flush=True)
          PYEOF

      - name: Pre-flight Check SuSFS Patch (Fail-Fast ~20s)
        if: ${{ (github.event.inputs.build_type || 'all') == 'all' || (github.event.inputs.build_type || 'all') == 'ksun-susfs' }}
        run: |
          if grep -rq "config KSU_SUSFS" drivers/kernelsu/ KernelSU-Next/ KernelSU/ fs/ 2>/dev/null; then
            echo ">>> Nhánh đã tích hợp sẵn SuSFS, bỏ qua bước tải patch."
          else
            echo ">>> Tải backport SuSFS mới nhất (4.19) & các repo patch KSUN..."
            rm -rf /tmp/susfs_419 /tmp/wild_patches /tmp/susfs4ksu
            git clone --depth=1 https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git /tmp/susfs_419
            git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/wild_patches
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu || true
            python3 /tmp/apply_susfs.py "$GITHUB_WORKSPACE" /tmp/susfs_419 /tmp/wild_patches preflight /tmp/susfs4ksu
          fi

      - name: Upload SuSFS Rejects Report (on Pre-flight Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: susfs-rejects-report
          path: /tmp/susfs_preflight_report.txt
          if-no-files-found: ignore

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git jq patch python3 libssl-dev libelf-dev libncurses-dev zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Clang Toolchain
        run: |
          mkdir -p clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r1/clang-r487747c.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

      - name: Set Kernel Version String (4.19.325-perf)
        run: |
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          rm -f localversion*
          : > .scmversion

          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-perf"/' arch/arm64/configs/vendor/kona-perf_defconfig
          find arch/arm64/configs -type f -exec sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-perf"/' {} +
          find arch/arm64/configs -type f -exec sed -i 's/^CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' {} +

          MUNCH_CFG="arch/arm64/configs/vendor/xiaomi/munch.config"
          if [ -f "$MUNCH_CFG" ]; then
            sed -i '/^CONFIG_LOCALVERSION=/d' "$MUNCH_CFG"
            sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' "$MUNCH_CFG"
            sed -i '/^# CONFIG_LOCALVERSION_AUTO/d' "$MUNCH_CFG"
            cat << 'EOF' >> "$MUNCH_CFG"
          CONFIG_LOCALVERSION="-perf"
          # CONFIG_LOCALVERSION_AUTO is not set
          EOF
          fi

          sed -i -E 's/(--set-str[[:space:]]+LOCALVERSION[[:space:]]+)("[^"]*"|'\''[^'\'']*'\''|[^[:space:]]+)/\1"-perf"/g' build.sh
          sed -i -E 's/\bLOCALVERSION=("[^"]*"|'\''[^'\'']*'\''|[^[:space:]]+)/LOCALVERSION=""/g' build.sh

      - name: Compile and Package Kernel (No-Root / KSU-Next No-SuSFS / KSU-Next SuSFS)
        id: build
        run: |
          chmod +x build.sh
          mkdir -p release_zips
          export LOCALVERSION=""

          MUNCH_CFG="arch/arm64/configs/vendor/xiaomi/munch.config"
          cp "$MUNCH_CFG" "${MUNCH_CFG}.bak"

          KSU_KBUILD=$(readlink -f drivers/kernelsu/Kbuild 2>/dev/null || true)
          if [ -f "$KSU_KBUILD" ]; then
            cp "$KSU_KBUILD" /tmp/Kbuild.bak
          fi

          VARIANT="${{ github.event.inputs.variant || 'both' }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'all' }}"

          verify_config_flag() {
            local mode="$1"
            local flag="$2"
            local found=0
            for cfg in out/.config out/*/.config; do
              [ -f "$cfg" ] || continue
              found=1
              if [ "$mode" = "must_on" ] && ! grep -q "^${flag}=y" "$cfg"; then
                echo "::error::${flag}=y không được bật trong ${cfg}!"
                exit 1
              fi
              if [ "$mode" = "must_off" ] && grep -q "^${flag}=y" "$cfg"; then
                echo "::error::${flag}=y vẫn đang bật trong ${cfg}!"
                exit 1
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "::warning::Không tìm thấy file .config trong out/ để kiểm tra ${flag}"
            fi
          }

          print_kernel_release() {
            for kr in out/include/config/kernel.release out/*/include/config/kernel.release; do
              [ -f "$kr" ] && echo ">>> Kernel Release (${kr}): $(cat "$kr")"
            done
          }

          detect_susfs_version() {
            local ver=""
            for h in include/linux/susfs.h $(find /tmp/susfs_419 /tmp/susfs4ksu -maxdepth 5 -name "susfs.h" 2>/dev/null); do
              [ -f "$h" ] || continue
              ver=$(grep -E '^[[:space:]]*#define[[:space:]]+SUSFS_VERSION[[:space:]]+' "$h" | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '[:space:]')
              [ -n "$ver" ] && break
            done
            if [ -z "$ver" ]; then
              echo "latest"
            elif [[ "$ver" == v* ]]; then
              echo "$ver"
            else
              echo "v${ver}"
            fi
          }

          # ==========================================
          # 1. BUILD NO-ROOT
          # ==========================================
          if [ "$BUILD_TYPE" = "noroot" ] || [ "$BUILD_TYPE" = "all" ]; then
            echo "=========================================="
            echo ">>> [1/3] Đang build bản No-Root..."
            echo "=========================================="
            cp "${MUNCH_CFG}.bak" "$MUNCH_CFG"
            sed -i '/^CONFIG_KSU/d' "$MUNCH_CFG"
            sed -i '/^# CONFIG_KSU/d' "$MUNCH_CFG"
            cat << 'EOF' >> "$MUNCH_CFG"
          # CONFIG_KSU is not set
          # CONFIG_KSU_SUSFS is not set
          EOF

            if [ -f "$KSU_KBUILD" ]; then
              echo 'obj-$(CONFIG_KSU) += kernelsu.o' > "$KSU_KBUILD"
            fi

            rm -rf out/aosp out/stock out/*.zip
            CLANG_PATH="${GITHUB_WORKSPACE}/clang" ./build.sh "$VARIANT"

            if [ -f "/tmp/Kbuild.bak" ] && [ -n "$KSU_KBUILD" ]; then
              cp /tmp/Kbuild.bak "$KSU_KBUILD"
            fi

            verify_config_flag must_off CONFIG_KSU
            print_kernel_release

            for f in out/*.zip; do
              [ -e "$f" ] || continue
              base=$(basename "$f" .zip)
              mv "$f" "release_zips/${base}-noroot.zip"
            done
          fi

          # ==========================================
          # 2. BUILD KSU-NEXT NO-SUSFS (Syscall Table Hook)
          # ==========================================
          if [ "$BUILD_TYPE" = "ksun-nosusfs" ] || [ "$BUILD_TYPE" = "all" ]; then
            echo "=========================================="
            echo ">>> [2/3] Đang build KernelSU-Next (No-SuSFS)..."
            echo "=========================================="
            cp "${MUNCH_CFG}.bak" "$MUNCH_CFG"
            sed -i '/^CONFIG_KSU/d' "$MUNCH_CFG"
            sed -i '/^# CONFIG_KSU/d' "$MUNCH_CFG"
            cat << 'EOF' >> "$MUNCH_CFG"
          CONFIG_KSU=y
          # CONFIG_KSU_MANUAL_HOOK is not set
          CONFIG_KSU_SYSCALL_TABLE_HOOK=y
          # CONFIG_KSU_SUSFS is not set
          EOF

            rm -rf out/aosp out/stock out/*.zip
            CLANG_PATH="${GITHUB_WORKSPACE}/clang" ./build.sh "$VARIANT"

            verify_config_flag must_on CONFIG_KSU
            verify_config_flag must_off CONFIG_KSU_SUSFS
            print_kernel_release

            for f in out/*.zip; do
              [ -e "$f" ] || continue
              base=$(basename "$f" .zip)
              mv "$f" "release_zips/${base}-ksun-nosusfs.zip"
            done
          fi

          # ==========================================
          # 3. BUILD KSU-NEXT SUSFS (Phiên bản mới nhất)
          # ==========================================
          if [ "$BUILD_TYPE" = "ksun-susfs" ] || [ "$BUILD_TYPE" = "all" ]; then
            echo "=========================================="
            echo ">>> [3/3] Đang chuẩn bị & build KernelSU-Next (SuSFS)..."
            echo "=========================================="

            if ! grep -rq "config KSU_SUSFS" drivers/kernelsu/ KernelSU-Next/ KernelSU/ fs/ 2>/dev/null; then
              if [ ! -d /tmp/susfs_419 ]; then
                git clone --depth=1 https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git /tmp/susfs_419
                git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/wild_patches
                git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu || true
              fi
              python3 /tmp/apply_susfs.py "$GITHUB_WORKSPACE" /tmp/susfs_419 /tmp/wild_patches apply /tmp/susfs4ksu
            fi

            SUSFS_VER=$(detect_susfs_version)
            echo ">>> Phiên bản SuSFS phát hiện được: ${SUSFS_VER}"
            echo "susfs_version=${SUSFS_VER}" >> "$GITHUB_OUTPUT"

            cp "${MUNCH_CFG}.bak" "$MUNCH_CFG"
            sed -i '/^CONFIG_KSU/d' "$MUNCH_CFG"
            sed -i '/^# CONFIG_KSU/d' "$MUNCH_CFG"

            if grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
              HOOK_BLOCK="CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_SYSCALL_TABLE_HOOK is not set
          # CONFIG_KSU_KPROBES_HOOK is not set"
            else
              echo "::warning::kernel/reboot.c chưa có ksu_handle_sys_reboot -> giữ CONFIG_KSU_SYSCALL_TABLE_HOOK=y."
              HOOK_BLOCK="# CONFIG_KSU_MANUAL_HOOK is not set
          CONFIG_KSU_SYSCALL_TABLE_HOOK=y"
            fi

            cat << EOF >> "$MUNCH_CFG"
          CONFIG_KSU=y
          ${HOOK_BLOCK}
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

            rm -rf out/aosp out/stock out/*.zip
            CLANG_PATH="${GITHUB_WORKSPACE}/clang" ./build.sh "$VARIANT"

            verify_config_flag must_on CONFIG_KSU
            verify_config_flag must_on CONFIG_KSU_SUSFS
            print_kernel_release

            for f in out/*.zip; do
              [ -e "$f" ] || continue
              base=$(basename "$f" .zip)
              mv "$f" "release_zips/${base}-ksun-susfs-${SUSFS_VER}.zip"
            done
          fi

          mv "${MUNCH_CFG}.bak" "$MUNCH_CFG"
          rm -f /tmp/Kbuild.bak
          ls -lh release_zips/

      - name: Download Latest KernelSU-Next Manager APKs
        id: ksun
        run: |
          mkdir -p ksun
          RELEASE_JSON=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest")

          KSUN_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
          APK_URLS=$(echo "$RELEASE_JSON" | jq -r '.assets[]?.browser_download_url // empty' | grep '\.apk$' || true)

          if [ -n "$APK_URLS" ]; then
            echo "Downloading KernelSU-Next ${KSUN_TAG}..."
            for url in $APK_URLS; do
              (cd ksun && curl -fLO --retry 3 "$url")
            done
          else
            echo "API fallback: downloading KernelSU-Next v3.4.2..."
            KSUN_TAG="v3.4.2"
            (cd ksun && curl -fLO --retry 3 "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/KernelSU_Next_v3.4.2-spoofed_33355-release.apk")
            (cd ksun && curl -fLO --retry 3 "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/KernelSU_Next_v3.4.2_33355-release.apk")
          fi

          echo "version=${KSUN_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload Flashable AnyKernel3 Zip
        uses: actions/upload-artifact@v4
        with:
          name: Strong-perf-Ignis-Rei-munch-${{ steps.meta.outputs.safe_branch }}-${{ github.event.inputs.variant || 'both' }}-${{ github.event.inputs.build_type || 'all' }}
          path: |
            release_zips/*.zip
            ksun/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Strong perf+ Ignis-Rei Kernel (munch) [${{ steps.meta.outputs.raw_branch }}] - ${{ github.event.inputs.variant || 'both' }} (${{ steps.meta.outputs.date }})"
          body: |
            ### Build Info
            - **Device:** Xiaomi Redmi K40S - POCO F4 (`munch`)
            - **Kernel Version:** `4.19.325-perf`
            - **Branch:** `${{ steps.meta.outputs.raw_branch }}`
            - **Variant:** `${{ github.event.inputs.variant || 'both' }}`
            - **Build Types:** `${{ github.event.inputs.build_type || 'all' }}` ${{ steps.build.outputs.susfs_version && format('(SuSFS `{0}`)', steps.build.outputs.susfs_version) || '' }}
            - **Build Date:** ${{ steps.meta.outputs.date }}
            - **KernelSU-Next Manager:** `${{ steps.ksun.outputs.version }}` (bản thường & bản `-spoofed`)
          files: |
            release_zips/*.zip
            ksun/*.apk
