name: Build release Strong perf+ Kernel - Ignis-Rei (munch) _KsuNext SUSFS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Nhập tên nhánh (branch) chứa patch / code sửa đổi (vd: main, perf)'
        required: true
        default: 'perf'
        type: string
      variant:
        description: 'Kernel Variant to Build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - aosp
          - stock
      build_type:
        description: 'Loại Kernel (all = build cả 3: noroot, ksun-nosusfs, ksun-susfs)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ksun-susfs
          - ksun-nosusfs
          - noroot

permissions:
  contents: write

jobs:
  build:
    name: Build Ignis-Rei for Xiaomi POCO F4 (munch)
    runs-on: ubuntu-22.04

    env:
      KBUILD_BUILD_USER: "strong"
      KBUILD_BUILD_HOST: "GitHub-Actions"

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'perf' }}
          fetch-depth: 1

      - name: Prepare Build Metadata
        id: meta
        run: |
          RAW_BRANCH="${{ github.event.inputs.branch || 'perf' }}"
          SAFE_BRANCH=$(echo "$RAW_BRANCH" | tr '/:@' '-')
          BUILD_DATE=$(TZ='Asia/Ho_Chi_Minh' date +'%Y%m%d-%H%M')
          DISPLAY_DATE=$(TZ='Asia/Ho_Chi_Minh' date +'%d/%m/%Y %H:%M ICT')
          echo "raw_branch=${RAW_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "safe_branch=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "tag=Strong-perf-Ignis-Rei-munch-${SAFE_BRANCH}-${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "date=${DISPLAY_DATE}" >> "$GITHUB_OUTPUT"

      - name: Create SuSFS Auto-Patch Helper Script
        run: |
          cat << 'PYEOF' > /tmp/apply_susfs.py
          import os, re, shutil, subprocess, sys

          root = sys.argv[1]
          susfs_repo = sys.argv[2]
          wild_repo = sys.argv[3]
          mode = sys.argv[4]  # "preflight" hoặc "apply"
          report_path = "/tmp/susfs_preflight_report.txt"

          kernel_patch = os.path.join(susfs_repo, "kernel_patches", "50_add_susfs_in_kernel-4.19.patch")
          if not os.path.isfile(kernel_patch):
              print(f"::error::Không tìm thấy {kernel_patch}")
              sys.exit(1)

          def get_susfs_version(base_dir):
              for rel in ("include/linux/susfs.h", "include/linux/susfs_def.h", "fs/susfs.c"):
                  fp = os.path.join(base_dir, rel)
                  if os.path.isfile(fp):
                      with open(fp, "r", errors="ignore") as f:
                          m = re.search(r'#define\s+SUSFS_VERSION\s+"([^"]+)"', f.read())
                          if m:
                              return m.group(1)
              return "unknown"

          def copy_tree(src, dst):
              for dirpath, _, filenames in os.walk(src):
                  rel = os.path.relpath(dirpath, src)
                  out_dir = os.path.join(dst, rel) if rel != "." else dst
                  os.makedirs(out_dir, exist_ok=True)
                  for fn in filenames:
                      shutil.copy2(os.path.join(dirpath, fn), os.path.join(out_dir, fn))

          def autofix_kernel_rejects(work_dir):
              # 1) Auto-fix fs/namespace.c (vfs_create_mount & clone_mnt)
              ns_c = os.path.join(work_dir, "fs/namespace.c")
              ns_rej = ns_c + ".rej"
              if os.path.exists(ns_rej) and os.path.exists(ns_c):
                  with open(ns_rej, "r", errors="ignore") as f:
                      rej = f.read()
                  with open(ns_c, "r", errors="ignore") as f:
                      src = f.read()
                  hunks = re.split(r'(?=^@@ )', rej, flags=re.M)
                  header = hunks[0]
                  remaining = []
                  for h in hunks[1:]:
                      # 1a) vfs_kern_mount -> vfs_create_mount (do kernel backport fs_context)
                      if "vfs_kern_mount" in h and "susfs_is_current_ksu_domain" in h and "alloc_vfsmnt(" in h:
                          patched_ns = False
                          m_fn = re.search(r'struct\s+vfsmount\s*\*vfs_create_mount\s*\(\s*struct\s+fs_context\s*\*fc\s*\)\s*\{', src)
                          if m_fn:
                              start = m_fn.end()
                              sub = src[start:start + 2500]
                              m_alloc = re.search(r'^([ \t]*)mnt\s*=\s*alloc_vfsmnt\(([^,\n;]+)\);', sub, flags=re.M)
                              if m_alloc and "susfs_is_current_ksu_domain" not in sub[:m_alloc.end() + 200]:
                                  ind, arg = m_alloc.group(1), m_alloc.group(2).strip()
                                  replacement = (
                                      f"#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                                      f"{ind}// For newly created mounts, the only caller process we care is KSU\n"
                                      f"{ind}if (unlikely(susfs_is_current_ksu_domain())) {{\n"
                                      f"{ind}\tmnt = alloc_vfsmnt({arg}, true, 0);\n"
                                      f"{ind}\tgoto bypass_orig_flow;\n"
                                      f"{ind}}}\n"
                                      f"{ind}mnt = alloc_vfsmnt({arg}, false, 0);\n"
                                      f"bypass_orig_flow:\n"
                                      f"#else\n"
                                      f"{ind}mnt = alloc_vfsmnt({arg});\n"
                                      f"#endif"
                                  )
                                  src = src[:start + m_alloc.start()] + replacement + src[start + m_alloc.end():]
                                  patched_ns = True
                                  print(">>> Auto-fixed fs/namespace.c (vfs_create_mount -> alloc_vfsmnt) thành công!")
                          if not patched_ns:
                              remaining.append(h)

                      # 1b) clone_mnt
                      elif "clone_mnt" in h and "susfs_is_current_zygote_domain" in h and "old->mnt_devname" in h:
                          patched_clone = False
                          m_fn = re.search(r'static\s+struct\s+mount\s*\*clone_mnt\s*\([^)]*\)\s*\{', src, flags=re.S)
                          if m_fn:
                              start = m_fn.end()
                              sub = src[start:start + 2500]
                              m_alloc = re.search(r'^([ \t]*)mnt\s*=\s*alloc_vfsmnt\(\s*old->mnt_devname\s*\);', sub, flags=re.M)
                              if m_alloc and "susfs_is_current_zygote_domain" not in sub[:m_alloc.end() + 200]:
                                  ind = m_alloc.group(1)
                                  replacement = (
                                      f"#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                                      f"{ind}{{\n"
                                      f"{ind}\tbool is_current_ksu_domain = susfs_is_current_ksu_domain();\n"
                                      f"{ind}\tbool is_current_zygote_domain = susfs_is_current_zygote_domain();\n"
                                      f"\n"
                                      f"{ind}\tif (unlikely(is_current_ksu_domain)) {{\n"
                                      f"{ind}\t\tif (!(flag & CL_COPY_MNT_NS)) {{\n"
                                      f"{ind}\t\t\tmnt = alloc_vfsmnt(old->mnt_devname, true, 0);\n"
                                      f"{ind}\t\t\tgoto bypass_orig_flow;\n"
                                      f"{ind}\t\t}}\n"
                                      f"{ind}\t\tmnt = alloc_vfsmnt(old->mnt_devname, true, old->mnt_id);\n"
                                      f"{ind}\t\tif (mnt) {{\n"
                                      f"{ind}\t\t\tmnt->mnt.susfs_mnt_id_backup = DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE;\n"
                                      f"{ind}\t\t}}\n"
                                      f"{ind}\t\tgoto bypass_orig_flow;\n"
                                      f"{ind}\t}}\n"
                                      f"{ind}\tif (likely(is_current_zygote_domain) && (old->mnt_id >= DEFAULT_SUS_MNT_ID)) {{\n"
                                      f"{ind}\t\tmnt = alloc_vfsmnt(old->mnt_devname, true, 0);\n"
                                      f"{ind}\t\tgoto bypass_orig_flow;\n"
                                      f"{ind}\t}}\n"
                                      f"{ind}\tif ((flag & CL_COPY_MNT_NS) && (old->mnt_id >= DEFAULT_SUS_MNT_ID)) {{\n"
                                      f"{ind}\t\tmnt = alloc_vfsmnt(old->mnt_devname, true, 0);\n"
                                      f"{ind}\t\tgoto bypass_orig_flow;\n"
                                      f"{ind}\t}}\n"
                                      f"{ind}\tmnt = alloc_vfsmnt(old->mnt_devname, false, 0);\n"
                                      f"bypass_orig_flow:;\n"
                                      f"{ind}}}\n"
                                      f"#else\n"
                                      f"{ind}mnt = alloc_vfsmnt(old->mnt_devname);\n"
                                      f"#endif"
                                  )
                                  src = src[:start + m_alloc.start()] + replacement + src[start + m_alloc.end():]
                                  patched_clone = True
                                  print(">>> Auto-fixed fs/namespace.c (clone_mnt -> alloc_vfsmnt) thành công!")
                          if not patched_clone:
                              remaining.append(h)
                      else:
                          remaining.append(h)

                  with open(ns_c, "w") as f:
                      f.write(src)
                  if not remaining:
                      os.remove(ns_rej)
                  else:
                      with open(ns_rej, "w") as f:
                          f.write(header + "".join(remaining))

              # 2) Auto-fix kernel/sys.c (susfs_spoof_uname trong SYSCALL_DEFINE1(newuname, ...))
              sys_c = os.path.join(work_dir, "kernel/sys.c")
              sys_rej = sys_c + ".rej"
              if os.path.exists(sys_rej) and os.path.exists(sys_c):
                  with open(sys_c, "r", errors="ignore") as f:
                      src = f.read()
                  changed = False
                  if "susfs_spoof_uname" not in src:
                      target_def = "SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)"
                      if target_def in src:
                          src = src.replace(
                              target_def,
                              "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\nextern void susfs_spoof_uname(struct new_utsname* tmp);\n#endif\n" + target_def,
                              1
                          )
                          pos = src.find(target_def)
                          sub = src[pos:]
                          m = re.search(r'(memcpy\(&tmp,\s*utsname\(\),\s*sizeof\(tmp\)\);)', sub)
                          if m:
                              ins = m.group(1) + "\n#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tsusfs_spoof_uname(&tmp);\n#endif"
                              src = src[:pos] + sub[:m.start()] + ins + sub[m.end():]
                              changed = True
                  if changed:
                      with open(sys_c, "w") as f:
                          f.write(src)
                      os.remove(sys_rej)
                      print(">>> Auto-fixed kernel/sys.c thành công!")

              # 3) Auto-fix #include <linux/susfs_def.h> trong fs/proc/task_mmu.c
              mmu_c = os.path.join(work_dir, "fs/proc/task_mmu.c")
              mmu_rej = mmu_c + ".rej"
              if os.path.exists(mmu_rej) and os.path.exists(mmu_c):
                  with open(mmu_rej, "r", errors="ignore") as f:
                      rej = f.read()
                  with open(mmu_c, "r", errors="ignore") as f:
                      src = f.read()
                  hunks = re.split(r'(?=^@@ )', rej, flags=re.M)
                  header = hunks[0]
                  remaining = []
                  for h in hunks[1:]:
                      if "susfs_def.h" in h and "#include" in h:
                          if "susfs_def.h" not in src:
                              for anchor in ("#include <linux/mm_inline.h>", "#include <linux/uaccess.h>", "#include <linux/pkeys.h>"):
                                  if anchor in src:
                                      src = src.replace(
                                          anchor,
                                          anchor + "\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif",
                                          1
                                      )
                                      print(">>> Auto-fixed #include <linux/susfs_def.h> trong fs/proc/task_mmu.c")
                                      break
                      else:
                          remaining.append(h)
                  with open(mmu_c, "w") as f:
                      f.write(src)
                  if not remaining:
                      os.remove(mmu_rej)
                  else:
                      with open(mmu_rej, "w") as f:
                          f.write(header + "".join(remaining))

          def dump_rejects(title, base_dir, rej_list, extra_info=""):
              lines = [f"=== {title} ({len(rej_list)} file .rej) ==="]
              if extra_info:
                  lines.append(extra_info)
              for rf in sorted(rej_list):
                  rel = os.path.relpath(rf, base_dir)
                  with open(rf, "r", errors="ignore") as f:
                      cnt = len(re.findall(r'^@@ ', f.read(), flags=re.M))
                  lines.append(f"  - {rel} ({cnt} hunk)")
              lines.append("")
              for rf in sorted(rej_list):
                  rel = os.path.relpath(rf, base_dir)
                  lines.append(f"================ {rel} ================")
                  with open(rf, "r", errors="ignore") as f:
                      lines.append(f.read())
              output = "\n".join(lines)
              with open(report_path, "w") as out:
                  out.write(output)
              print(f"::error::{title}")
              print(output)
              sys.exit(1)

          if mode == "preflight":
              work_dir = "/tmp/susfs_preflight"
              shutil.rmtree(work_dir, ignore_errors=True)
              os.makedirs(work_dir, exist_ok=True)
              with open(kernel_patch, "r", errors="ignore") as f:
                  patch_txt = f.read()
              touched = set(re.findall(r'^(?:--- a/|\+\+\+ b/)([^\s\t]+)', patch_txt, flags=re.M))
              for rel in touched:
                  src_file = os.path.join(root, rel)
                  if os.path.isfile(src_file):
                      dst_file = os.path.join(work_dir, rel)
                      os.makedirs(os.path.dirname(dst_file), exist_ok=True)
                      shutil.copy2(src_file, dst_file)
          else:
              work_dir = root

          copy_tree(os.path.join(susfs_repo, "kernel_patches", "fs"), os.path.join(work_dir, "fs"))
          copy_tree(os.path.join(susfs_repo, "kernel_patches", "include", "linux"), os.path.join(work_dir, "include", "linux"))

          susfs_ver = get_susfs_version(work_dir)
          print(f">>> SuSFS Version phát hiện: {susfs_ver}")

          with open(kernel_patch, "rb") as pf:
              subprocess.run(
                  ["patch", "-p1", "--forward", "--batch", "--fuzz=3"],
                  cwd=work_dir, stdin=pf, check=False
              )

          autofix_kernel_rejects(work_dir)

          rej_files = [
              os.path.join(dp, fn)
              for dp, _, fns in os.walk(work_dir)
              for fn in fns if fn.endswith(".rej")
          ]
          if rej_files:
              dump_rejects(f"50_add_susfs_in_kernel-4.19.patch ({susfs_ver}) vẫn còn file .rej cần xử lý", work_dir, rej_files)

          print(f">>> Áp patch SuSFS ({susfs_ver}) cho kernel 4.19 thành công (0 .rej)!")

          # Kiểm tra & áp patch cho KernelSU-Next
          ksu_kconfig = os.path.realpath(os.path.join(root, "drivers/kernelsu/Kconfig"))
          ksu_dir = os.path.dirname(ksu_kconfig)
          ksu_root = os.path.dirname(ksu_dir) if os.path.basename(ksu_dir) == "kernel" else ksu_dir

          if mode == "preflight":
              ksu_work = "/tmp/ksu_preflight"
              shutil.rmtree(ksu_work, ignore_errors=True)
              shutil.copytree(ksu_root, ksu_work, symlinks=True)
              target_ksu_root = ksu_work
              target_ksu_dir = os.path.join(ksu_work, "kernel") if os.path.isdir(os.path.join(ksu_work, "kernel")) else ksu_work
          else:
              target_ksu_root = ksu_root
              target_ksu_dir = ksu_dir

          local_patch_dir = os.path.join(root, ".github", "patches")
          candidates = []
          for base in (local_patch_dir, wild_repo, susfs_repo):
              if not os.path.isdir(base):
                  continue
              for dp, _, fns in os.walk(base):
                  for fn in fns:
                      low = fn.lower()
                      if low.endswith(".patch") and ("susfs" in low) and ("ksun" in low or "next" in low or "ksu" in low):
                          candidates.append(os.path.join(dp, fn))

          def patch_priority(p):
              low = os.path.basename(p).lower()
              is_local = 0 if p.startswith(local_patch_dir) else 1
              is_ksun = 0 if ("ksun" in low or "next" in low) else 1
              is_active = 0 if "/archived/" not in p else 1
              return (is_local, is_ksun, is_active, p)

          candidates.sort(key=patch_priority)

          print(">>> Danh sách patch KSU/SuSFS tìm thấy:")
          for c in candidates:
              print("   *", c)

          if not candidates:
              print("::error::Không tìm thấy file patch SuSFS cho KernelSU-Next!")
              sys.exit(1)

          def detect_strip_and_cwd(patch_text):
              has_kernel_prefix = bool(re.search(r'^\+\+\+ b/kernel/', patch_text, flags=re.M))
              has_kernel_subdir = os.path.isdir(os.path.join(target_ksu_root, "kernel"))
              if has_kernel_prefix and has_kernel_subdir:
                  return "1", target_ksu_root
              elif has_kernel_prefix and not has_kernel_subdir:
                  return "2", target_ksu_dir
              else:
                  return "1", target_ksu_dir

          selected_patch = None
          selected_strip = "1"
          selected_cwd = target_ksu_dir

          for cand in candidates:
              with open(cand, "r", errors="ignore") as f:
                  txt = f.read()
              p_strip, p_cwd = detect_strip_and_cwd(txt)
              with open(cand, "rb") as pf:
                  dry = subprocess.run(
                      ["patch", f"-p{p_strip}", "--dry-run", "--forward", "--batch", "--fuzz=3"],
                      cwd=p_cwd, stdin=pf, capture_output=True, text=True
                  )
              if dry.returncode == 0 and "No file to patch" not in dry.stdout and "No file to patch" not in dry.stderr:
                  selected_patch = cand
                  selected_strip = p_strip
                  selected_cwd = p_cwd
                  break

          if not selected_patch:
              selected_patch = candidates[0]
              with open(selected_patch, "r", errors="ignore") as f:
                  selected_strip, selected_cwd = detect_strip_and_cwd(f.read())

          print(f">>> Đang áp patch KernelSU-Next (-p{selected_strip} tại {selected_cwd}): {selected_patch}")
          with open(selected_patch, "rb") as pf:
              res = subprocess.run(
                  ["patch", f"-p{selected_strip}", "--forward", "--batch", "--fuzz=3"],
                  cwd=selected_cwd, stdin=pf, capture_output=True, text=True
              )
          print(res.stdout)
          if res.stderr:
              print(res.stderr)

          ksu_rejs = [
              os.path.join(dp, fn)
              for dp, _, fns in os.walk(target_ksu_root)
              for fn in fns if fn.endswith(".rej")
          ]
          target_kconfig = os.path.join(target_ksu_dir, "Kconfig")
          has_susfs_kconfig = False
          if os.path.isfile(target_kconfig):
              with open(target_kconfig, "r", errors="ignore") as kf:
                  has_susfs_kconfig = "config KSU_SUSFS" in kf.read()

          if ksu_rejs or res.returncode != 0 or "No file to patch" in res.stdout or not has_susfs_kconfig:
              extra = (
                  f"SuSFS Version: {susfs_ver}\n"
                  f"Patch: {selected_patch} (strip=-p{selected_strip}, rc={res.returncode}, has_susfs_kconfig={has_susfs_kconfig})\n"
                  f"Stdout:\n{res.stdout}\nStderr:\n{res.stderr}\n"
                  "Available KSU patches:\n" + "\n".join("  " + c for c in candidates)
              )
              if ksu_rejs:
                  dump_rejects(f"Patch {os.path.basename(selected_patch)} bị conflict với KernelSU-Next", target_ksu_root, ksu_rejs, extra)
              else:
                  with open(report_path, "w") as out:
                      out.write(extra)
                  print(f"::error::Áp patch {os.path.basename(selected_patch)} thất bại hoặc không khớp cấu trúc KernelSU-Next!")
                  print(extra)
                  sys.exit(1)

          print(f">>> Áp patch SuSFS ({susfs_ver}) cho KernelSU-Next thành công (0 .rej, Kconfig đã có KSU_SUSFS)!")
          PYEOF

      - name: Pre-flight Check SuSFS Patch (Fail-Fast ~20s)
        if: ${{ (github.event.inputs.build_type || 'all') == 'all' || (github.event.inputs.build_type || 'all') == 'ksun-susfs' }}
        run: |
          if grep -rq "config KSU_SUSFS" drivers/kernelsu/ KernelSU-Next/ KernelSU/ fs/ 2>/dev/null; then
            SUSFS_VER=$(grep -rhE '#define[[:space:]]+SUSFS_VERSION[[:space:]]+"' include/linux/susfs*.h fs/susfs.c 2>/dev/null | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            echo ">>> Nhánh đã tích hợp sẵn SuSFS (${SUSFS_VER:-unknown}), bỏ qua bước tải patch."
          else
            echo ">>> Tải susfs4ksu (kernel-4.19) & kiểm tra nhanh patch trước khi tải Clang..."
            rm -rf /tmp/susfs4ksu /tmp/wild_patches
            git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
            git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/wild_patches || true
            python3 /tmp/apply_susfs.py "$GITHUB_WORKSPACE" /tmp/susfs4ksu /tmp/wild_patches preflight
          fi

      - name: Upload SuSFS Rejects Report (on Pre-flight Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: susfs-rejects-report
          path: /tmp/susfs_preflight_report.txt
          if-no-files-found: ignore

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git jq patch python3 libssl-dev libelf-dev libncurses-dev zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Clang Toolchain
        run: |
          mkdir -p clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r1/clang-r487747c.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

      - name: Set Kernel Version String (4.19.325-perf+)
        run: |
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          rm -f localversion*

          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-perf"/' arch/arm64/configs/vendor/kona-perf_defconfig
          find arch/arm64/configs -type f -exec sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-perf"/' {} +
          find arch/arm64/configs -type f -exec sed -i 's/^CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' {} +

          MUNCH_CFG="arch/arm64/configs/vendor/xiaomi/munch.config"
          if [ -f "$MUNCH_CFG" ]; then
            sed -i '/^CONFIG_LOCALVERSION=/d' "$MUNCH_CFG"
            echo 'CONFIG_LOCALVERSION="-perf"' >> "$MUNCH_CFG"
          fi

          sed -i -E 's/(--set-str[[:space:]]+LOCALVERSION[[:space:]]+)("[^"]*"|'\''[^'\'']*'\''|[^[:space:]]+)/\1"-perf"/g' build.sh
          sed -i -E 's/\bLOCALVERSION=("[^"]*"|'\''[^'\'']*'\''|[^[:space:]]+)/LOCALVERSION=""/g' build.sh

      - name: Compile and Package Kernel (No-Root / KSU-Next No-SuSFS / KSU-Next SuSFS)
        id: build
        run: |
          chmod +x build.sh
          mkdir -p release_zips

          MUNCH_CFG="arch/arm64/configs/vendor/xiaomi/munch.config"
          cp "$MUNCH_CFG" "${MUNCH_CFG}.bak"

          KSU_KBUILD=$(readlink -f drivers/kernelsu/Kbuild 2>/dev/null || true)
          if [ -f "$KSU_KBUILD" ]; then
            cp "$KSU_KBUILD" /tmp/Kbuild.bak
          fi

          VARIANT="${{ github.event.inputs.variant || 'both' }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'all' }}"
          SUSFS_VER=""

          verify_config_flag() {
            local mode="$1"
            local flag="$2"
            local found=0
            for cfg in out/.config out/*/.config; do
              [ -f "$cfg" ] || continue
              found=1
              if [ "$mode" = "must_on" ] && ! grep -q "^${flag}=y" "$cfg"; then
                echo "::error::${flag}=y không được bật trong ${cfg}!"
                exit 1
              fi
              if [ "$mode" = "must_off" ] && grep -q "^${flag}=y" "$cfg"; then
                echo "::error::${flag}=y vẫn đang bật trong ${cfg}!"
                exit 1
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "::warning::Không tìm thấy file .config trong out/ để kiểm tra ${flag}"
            fi
          }

          print_kernel_release() {
            for kr in out/include/config/kernel.release out/*/include/config/kernel.release; do
              [ -f "$kr" ] && echo ">>> Kernel Release (${kr}): $(cat "$kr")"
            done
          }

          # ==========================================
          # 1. BUILD NO-ROOT
          # ==========================================
          if [ "$BUILD_TYPE" = "noroot" ] || [ "$BUILD_TYPE" = "all" ]; then
            echo "=========================================="
            echo ">>> [1/3] Đang build bản No-Root..."
            echo "=========================================="
            cp "${MUNCH_CFG}.bak" "$MUNCH_CFG"
            sed -i '/^CONFIG_KSU/d' "$MUNCH_CFG"
            sed -i '/^# CONFIG_KSU/d' "$MUNCH_CFG"
            cat << 'EOF' >> "$MUNCH_CFG"
          # CONFIG_KSU is not set
          # CONFIG_KSU_SUSFS is not set
          EOF

            if [ -f "$KSU_KBUILD" ]; then
              echo 'obj-$(CONFIG_KSU) += kernelsu.o' > "$KSU_KBUILD"
            fi

            rm -rf out/aosp out/stock out/*.zip
            CLANG_PATH="${GITHUB_WORKSPACE}/clang" ./build.sh "$VARIANT"

            if [ -f "/tmp/Kbuild.bak" ] && [ -n "$KSU_KBUILD" ]; then
              cp /tmp/Kbuild.bak "$KSU_KBUILD"
            fi

            verify_config_flag must_off CONFIG_KSU
            print_kernel_release

            for f in out/*.zip; do
              [ -e "$f" ] || continue
              base=$(basename "$f" .zip)
              mv "$f" "release_zips/${base}-noroot.zip"
            done
          fi

          # ==========================================
          # 2. BUILD KSU-NEXT NO-SUSFS (Syscall Table Hook)
          # ==========================================
          if [ "$BUILD_TYPE" = "ksun-nosusfs" ] || [ "$BUILD_TYPE" = "all" ]; then
            echo "=========================================="
            echo ">>> [2/3] Đang build KernelSU-Next (No-SuSFS)..."
            echo "=========================================="
            cp "${MUNCH_CFG}.bak" "$MUNCH_CFG"
            sed -i '/^CONFIG_KSU/d' "$MUNCH_CFG"
            sed -i '/^# CONFIG_KSU/d' "$MUNCH_CFG"
            cat << 'EOF' >> "$MUNCH_CFG"
          CONFIG_KSU=y
          # CONFIG_KSU_MANUAL_HOOK is not set
          CONFIG_KSU_SYSCALL_TABLE_HOOK=y
          # CONFIG_KSU_SUSFS is not set
          EOF

            rm -rf out/aosp out/stock out/*.zip
            CLANG_PATH="${GITHUB_WORKSPACE}/clang" ./build.sh "$VARIANT"

            verify_config_flag must_on CONFIG_KSU
            verify_config_flag must_off CONFIG_KSU_SUSFS
            print_kernel_release

            for f in out/*.zip; do
              [ -e "$f" ] || continue
              base=$(basename "$f" .zip)
              mv "$f" "release_zips/${base}-ksun-nosusfs.zip"
            done
          fi

          # ==========================================
          # 3. BUILD KSU-NEXT SUSFS
          # ==========================================
          if [ "$BUILD_TYPE" = "ksun-susfs" ] || [ "$BUILD_TYPE" = "all" ]; then
            echo "=========================================="
            echo ">>> [3/3] Đang chuẩn bị & build KernelSU-Next (SuSFS)..."
            echo "=========================================="

            if ! grep -rq "config KSU_SUSFS" drivers/kernelsu/ KernelSU-Next/ KernelSU/ fs/ 2>/dev/null; then
              python3 /tmp/apply_susfs.py "$GITHUB_WORKSPACE" /tmp/susfs4ksu /tmp/wild_patches apply
            fi

            SUSFS_VER=$(grep -rhE '#define[[:space:]]+SUSFS_VERSION[[:space:]]+"' include/linux/susfs*.h fs/susfs.c 2>/dev/null | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            SUSFS_VER="${SUSFS_VER:-unknown}"
            echo "=========================================="
            echo ">>> SuSFS Version: ${SUSFS_VER}"
            echo "=========================================="
            echo "susfs_version=${SUSFS_VER}" >> "$GITHUB_OUTPUT"
            echo "### SuSFS Version: \`${SUSFS_VER}\`" >> "$GITHUB_STEP_SUMMARY"

            cp "${MUNCH_CFG}.bak" "$MUNCH_CFG"
            sed -i '/^CONFIG_KSU/d' "$MUNCH_CFG"
            sed -i '/^# CONFIG_KSU/d' "$MUNCH_CFG"

            if grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
              HOOK_BLOCK="CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_SYSCALL_TABLE_HOOK is not set
          # CONFIG_KSU_KPROBES_HOOK is not set"
            else
              echo "::warning::kernel/reboot.c chưa có ksu_handle_sys_reboot -> giữ CONFIG_KSU_SYSCALL_TABLE_HOOK=y."
              HOOK_BLOCK="# CONFIG_KSU_MANUAL_HOOK is not set
          CONFIG_KSU_SYSCALL_TABLE_HOOK=y"
            fi

            cat << EOF >> "$MUNCH_CFG"
          CONFIG_KSU=y
          ${HOOK_BLOCK}
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

            rm -rf out/aosp out/stock out/*.zip
            CLANG_PATH="${GITHUB_WORKSPACE}/clang" ./build.sh "$VARIANT"

            verify_config_flag must_on CONFIG_KSU
            verify_config_flag must_on CONFIG_KSU_SUSFS
            print_kernel_release

            for f in out/*.zip; do
              [ -e "$f" ] || continue
              base=$(basename "$f" .zip)
              mv "$f" "release_zips/${base}-ksun-susfs.zip"
            done
          fi

          mv "${MUNCH_CFG}.bak" "$MUNCH_CFG"
          rm -f /tmp/Kbuild.bak
          ls -lh release_zips/

      - name: Download Latest KernelSU-Next Manager APKs
        id: ksun
        run: |
          mkdir -p ksun
          RELEASE_JSON=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest")

          KSUN_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
          APK_URLS=$(echo "$RELEASE_JSON" | jq -r '.assets[]?.browser_download_url // empty' | grep '\.apk$' || true)

          if [ -n "$APK_URLS" ]; then
            echo "Downloading KernelSU-Next ${KSUN_TAG}..."
            for url in $APK_URLS; do
              (cd ksun && curl -fLO --retry 3 "$url")
            done
          else
            echo "API fallback: downloading KernelSU-Next v3.4.2..."
            KSUN_TAG="v3.4.2"
            (cd ksun && curl -fLO --retry 3 "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/KernelSU_Next_v3.4.2-spoofed_33355-release.apk")
            (cd ksun && curl -fLO --retry 3 "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/KernelSU_Next_v3.4.2_33355-release.apk")
          fi

          echo "version=${KSUN_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload Flashable AnyKernel3 Zip
        uses: actions/upload-artifact@v4
        with:
          name: Strong-perf-Ignis-Rei-munch-${{ steps.meta.outputs.safe_branch }}-${{ github.event.inputs.variant || 'both' }}-${{ github.event.inputs.build_type || 'all' }}
          path: |
            release_zips/*.zip
            ksun/*.apk

      - name: Prepare Release Notes
        run: |
          cat << 'EOF' > /tmp/release_body.md
          ### Build Info
          - **Device:** Xiaomi Redmi K40S - POCO F4 (`munch`)
          - **Kernel Version:** `4.19.325-perf+`
          - **Branch:** `${{ steps.meta.outputs.raw_branch }}`
          - **Variant:** `${{ github.event.inputs.variant || 'both' }}`
          - **Build Types:** `${{ github.event.inputs.build_type || 'all' }}` (`ksun-susfs`, `ksun-nosusfs`, `noroot`)
          - **Build Date:** ${{ steps.meta.outputs.date }}
          - **KernelSU-Next Manager:** `${{ steps.ksun.outputs.version }}` (bản thường & bản `-spoofed`)
          EOF

          if [ -n "${{ steps.build.outputs.susfs_version }}" ]; then
            echo "- **SuSFS Version:** \`${{ steps.build.outputs.susfs_version }}\`" >> /tmp/release_body.md
          fi
          cat /tmp/release_body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Strong perf+ Ignis-Rei Kernel (munch) [${{ steps.meta.outputs.raw_branch }}] - ${{ github.event.inputs.variant || 'both' }} (${{ steps.meta.outputs.date }})"
          body_path: /tmp/release_body.md
          files: |
            release_zips/*.zip
            ksun/*.apk
